services:
  # Postgres isolado só para os testes de integração — porta 55432 (não a
  # 5432 padrão) para nunca colidir com um Postgres de desenvolvimento já
  # rodando na máquina. Sem volume nomeado: dados descartáveis de propósito.
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: solidaria_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d solidaria_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
